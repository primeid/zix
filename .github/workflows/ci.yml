name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-linux
            ext: tar.xz
            zdir: zig-x86_64-linux-0.16.0
          - os: macos-latest
            triple: aarch64-macos
            ext: tar.xz
            zdir: zig-aarch64-macos-0.16.0
          - os: windows-latest
            triple: x86_64-windows
            ext: zip
            zdir: zig-x86_64-windows-0.16.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0 (ziglang.org)
        shell: bash
        run: |
          set -eux
          curl -L -o "zig.${{ matrix.ext }}" \
            "https://ziglang.org/download/0.16.0/zig-${{ matrix.triple }}-0.16.0.${{ matrix.ext }}"
          # Windows: bsdtar reads .zip; Linux/macOS: xz
          if [ "${{ matrix.ext }}" = "zip" ]; then tar -xf "zig.zip"; else tar -xJf "zig.tar.xz"; fi
          echo "$PWD/${{ matrix.zdir }}" >> "$GITHUB_PATH"
          "$PWD/${{ matrix.zdir }}/zig" version

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Smoke test (evaluate a derivation)
        run: |
          zig-out/bin/zix eval --read-only -E '(builtins.derivation { name = "ci-check"; system = "x86_64-linux"; builder = "/bin/sh"; }).drvPath'
