name: Close stale issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days. If it is still relevant,
            please comment or it will be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 60 days. If it is still
            work in progress, please comment or it will be closed in 14 days.
          close-issue-message: >
            Closing because this issue has been inactive. Feel free to reopen
            if it is still relevant.
          close-pr-message: >
            Closing because this pull request has been inactive. Feel free to
            reopen with updates.
          days-before-issue-stale: 60
          days-before-pr-stale: 60
          days-before-issue-close: 14
          days-before-pr-close: 14
