name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-linux
          - os: macos-latest
            triple: aarch64-macos
          - os: windows-latest
            triple: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0 (ziglang.org)
        shell: bash
        run: |
          set -eux
          curl -L -o zig.tar \
            "https://ziglang.org/download/0.16.0/zig-${{ matrix.triple }}-0.16.0.tar.xz"
          tar -xJf zig.tar
          echo "$PWD/zig-${{ matrix.triple }}-0.16.0" >> "$GITHUB_PATH"
          zig version

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Smoke test (evaluate a derivation)
        run: |
          zig-out/bin/zix eval --read-only -E '(builtins.derivation { name = "ci-check"; system = "x86_64-linux"; builder = "/bin/sh"; }).drvPath'
